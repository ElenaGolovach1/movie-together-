<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<!-- Без «реферера» многие сайты не блокируют видео как «встроенное на чужой странице» -->
<meta name="referrer" content="no-referrer">
<title>Вдвоём — кино на двоих</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="home" class="screen center" hidden>
  <div class="logo">▶</div>
  <h1>Вдвоём</h1>
  <p class="lead">Смотрите фильмы вместе, даже если вы далеко друг от друга. Видео синхронно, голос и чат&nbsp;— прямо в браузере.</p>
  <button id="createBtn" class="btn primary big">Создать комнату</button>
  <p class="hint">Потом отправьте ссылку-приглашение второму человеку</p>
</main>

<main id="join" class="screen center" hidden>
  <div class="logo">▶</div>
  <h1>Вас ждут в комнате</h1>
  <form id="joinForm" class="stack">
    <label for="nameInput" class="hint">Как вас зовут?</label>
    <input id="nameInput" maxlength="24" placeholder="Ваше имя" autocomplete="nickname" required>
    <button class="btn primary big">Войти</button>
  </form>
</main>

<main id="room" hidden>
  <header class="bar">
    <div class="presence" aria-live="polite">
      <span class="dot" id="dot"></span>
      <span id="presenceText">Ждём второго человека…</span>
    </div>
    <button id="inviteBtn" class="btn chip" type="button">Пригласить</button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <section class="stage">
    <form id="urlForm" class="urlbar">
      <input id="urlInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ссылка на видео (.mp4, .webm, .m3u8)" required>
      <button class="btn primary">Смотреть</button>
    </form>
    <div class="player">
      <video id="video" playsinline controls preload="metadata"></video>
      <div id="empty" class="overlay">
        <p>Вставьте выше прямую ссылку на видео<br><span class="hint">файл .mp4 / .webm или поток .m3u8</span></p>
        <button id="demoBtn" class="btn chip" type="button">Попробовать тестовое видео</button>
      </div>
      <div id="playerMsg" class="overlay err" hidden></div>
    </div>
    <button id="unlock" class="unlock" hidden>Нажмите, чтобы подключиться к просмотру</button>
  </section>

  <section class="side">
    <div class="voice">
      <button id="micBtn" class="btn mic" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg>
        <span id="micText">Включить микрофон</span>
      </button>
      <span id="voiceState" class="hint"></span>
    </div>
    <div id="messages" class="messages"></div>
    <form id="chatForm" class="chatbar">
      <input id="chatInput" maxlength="500" placeholder="Сообщение…" autocomplete="off">
      <button class="btn primary send" aria-label="Отправить">➤</button>
    </form>
  </section>
</main>

<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
